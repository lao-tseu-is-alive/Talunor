name: Docker-publish

on:
  push:
    # Triggers only on semantic version tags.
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to (re)publish, e.g. v0.23.2. Leave empty to use the current ref.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>; metadata-action lowercases it for ghcr.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # required for uploading SARIF results.

    steps:
      # Publishing is triggered by a tag push — an event that cannot be replayed.
      # When Actions is unavailable at that moment (it happened: a major outage
      # swallowed v0.23.2's runs), the only recovery used to be re-pushing a public
      # tag. workflow_dispatch adds a second door, and this step is what makes it
      # actually useful: it resolves WHICH tag to publish, from the manual input or
      # from the pushed ref, so a dispatched run produces the same artefacts as the
      # automatic one instead of building whatever main happens to be.
      - name: Resolve the tag to publish
        id: target
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF#refs/tags/}"
          # ANCHORED, not a shell glob. `case` patterns are globs: `v[0-9]*.[0-9]*.[0-9]*`
          # reads as "a digit then anything", so it happily accepts v1abc.2.3 and
          # v1.2.3-oops. A publish target must be exactly vMAJOR.MINOR.PATCH.
          printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::'$tag' is not an exact vX.Y.Z tag — refusing to publish"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $tag" >&2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      # The tag says which version this is; internal/version says which version the
      # code believes it is. If they disagree, something was tagged off-ritual and the
      # artefact would carry a version its own binary denies.
      - name: Tag matches internal/version
        run: |
          want="${{ steps.target.outputs.tag }}"
          got="v$(grep -oE 'Version = "[0-9]+\.[0-9]+\.[0-9]+"' internal/version/version.go \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ "$want" = "$got" ] || {
            echo "::error::tag $want but internal/version says $got — refusing to publish"; exit 1; }
          echo "version check: $want == $got"

      - name: Build metadata
        run: |
          echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          # github.sha is the DISPATCHING ref's commit, which is not the tag's on a
          # manual run — stamp the image with what was actually checked out. This
          # feeds both the COMMIT build-arg and the sha- image tag below.
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup Docker buildx
        # docker/setup-buildx-action v3 — pinned to commit SHA (supply-chain).
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log into registry ${{ env.REGISTRY }}
        # docker/login-action v3 — pinned to commit SHA (supply-chain).
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build the image locally first, so it can be scanned before any push.
      #    The Dockerfile runs `make deps` + the cgo build; nothing to prebuild.
      - name: Build local image
        # docker/build-push-action v5 — pinned to commit SHA (supply-chain).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          load: true # load into the local docker daemon instead of pushing.
          tags: talunor:test
          build-args: |
            COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Install a known-good Trivy (see the 2026 supply-chain incident).
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          # The input is 'version' (not 'trivy-version'); 0.71.2 post-dates the
          # malicious 0.69.4 and the yanked 0.69.1. trivy-action defaults to this
          # same version, so its internal install is a cache hit.
          version: 'v0.71.2'

      # 3. Scan the built image and report to the Security tab.
      - name: Run Trivy vulnerability scanner
        # aquasecurity/trivy-action — pinned to commit SHA (supply-chain).
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6
        with:
          image-ref: 'talunor:test'
          severity: 'MEDIUM,CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # 4. Gate: fail (and block the push) on fixable HIGH/CRITICAL. Runs after
      #    the SARIF upload so findings still reach the Security tab on failure;
      #    reuses the DB cached above (skip-db-update) so it is fast.
      - name: Fail on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6
        with:
          image-ref: 'talunor:test'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          skip-db-update: true

      # 5. Push — only reached when the scan gate passed.
      - name: Extract Docker metadata
        id: meta
        # docker/metadata-action v5 — pinned to commit SHA (supply-chain).
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is deliberately restricted to the automatic path. Re-publishing
          # an older version is a REPAIR, not a release: without this guard, a
          # dispatch for v0.23.2 moves `latest` backwards off the newest version and
          # anyone pulling :latest silently downgrades.
          #
          # It MUST be done through `flavor`, not through a tags rule. In auto mode
          # (the default) metadata-action emits `latest` on its own as soon as a
          # type=semver pattern matches; a `type=raw,value=latest,enable=false` rule
          # adds a disabled duplicate and leaves that default untouched. v0.23.4
          # shipped exactly that mistake and the workflow went green while still
          # tagging `latest` on a repair.
          flavor: |
            latest=${{ github.event_name == 'push' }}
          # Both patterns are pinned to what was RESOLVED and CHECKED OUT, never to
          # the ref that triggered the run — on a manual re-publish those differ.
          #
          # The sha tag goes through type=raw because `type=sha` accepts only
          # enable/priority/prefix/suffix/format: a `value=` on it is SILENTLY
          # IGNORED and the action falls back to github.sha. That was the other half
          # of the v0.23.4 mistake — an option that does not exist fails quietly.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.target.outputs.tag }}
            type=raw,value=sha-${{ env.BUILD_COMMIT }}

      - name: Build and push Docker image
        # docker/build-push-action v5 — pinned to commit SHA (supply-chain).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
